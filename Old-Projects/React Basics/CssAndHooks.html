<!DOCTYPE html>
<html>
  <head>
    <title>Css and Hooks</title>
    <style>
        .on-button {
            background-color: rgb(25,135,84);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            
        }

        .off-button {
            background-color: rgb(220,53,69);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            
        }
    </style>
  </head>
  <body>
    <div class="js-container"></div> <!-- container for react -->
<!--above is html structure--> 
    <script src="react-basics.js"></script> <!--load from file -->
    <script src="https://unpkg.com/supersimpledev@8.6.4/external-library.js"></script> <!-- external-library -->
    <!-- how to load an external library -->

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script> <!-- external library for js xml translation -->
    <script type="text/babel"> 
        
        function App() {
            const [isButtonOn, setIsButtonOn] = React.useState(true);

            function switchButtonOn() {
                //setIsbuttonOn(!isButtonOn);
                if (isButtonOn) {
                    setIsButtonOn(false);
                } else {
                    setIsButtonOn(true);
                }
            }
            return (
            <button className={isButtonOn ? 'on-button' : 'off-button'}
            onClick={switchButtonOn}
            >
            {isButtonOn ? 'ON' : 'OFF'}
            </button>
            );
        }


      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />); 
    </script> <!-- react setup -->
  </body>
</html>
